name: Build Chess Assistant

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Stockfish 18 + fetch net
        run: |
          git clone --depth 1 --branch sf_18 https://github.com/official-stockfish/Stockfish.git sf
          cd sf/src && make net && ls -la *.nnue

      - name: Cross-compile Stockfish for iOS arm64 -> libstockfish.a
        run: |
          cd sf/src
          SDK=$(xcrun -sdk iphoneos --show-sdk-path)
          CXX=$(xcrun -sdk iphoneos -f clang++)
          FLAGS="-arch arm64 -isysroot $SDK -miphoneos-version-min=15.0 \
                 -std=c++17 -O3 -DNDEBUG -fno-exceptions \
                 -DUSE_PTHREADS -DIS_64BIT -DUSE_POPCNT -DUSE_NEON=8 \
                 -I. -w"
          set -e
          for f in $(find . -name '*.cpp' ! -path './universal/*'); do
            $CXX $FLAGS -c "$f" -o "$f.o"
          done
          ar rcs libstockfish.a $(find . -name '*.cpp.o' ! -name 'main.cpp.o')
          echo "libstockfish.a: $(du -h libstockfish.a | cut -f1)"

      - name: Fetch Maia CoreML model into layout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "layout/Library/Application Support/Chess"
          gh release download maia-model --repo "${{ github.repository }}" --pattern "maia3_23m.mlpackage.zip" --output model.zip
          unzip -q model.zip -d "layout/Library/Application Support/Chess"
          chmod -R a+rX "layout/Library/Application Support/Chess"
          find "layout/Library/Application Support/Chess" -maxdepth 2 -print
          # stage flat copies for embedding into the dylib (see Makefile)
          MP="layout/Library/Application Support/Chess/maia3_23m.mlpackage"
          cp "$MP/Manifest.json" maia_mfst.json
          cp "$MP/Data/com.apple.CoreML/model.mlmodel" maia_model.bin
          cp "$MP/Data/com.apple.CoreML/weights/weight.bin" maia_wghts.bin
          ls -la maia_mfst.json maia_model.bin maia_wghts.bin

      - name: Setup Theos
        uses: beerpiss/theos-action@v1
        with:
          cache: true

      - name: Build .deb
        run: make package FINALPACKAGE=1
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Publish .deb as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEB=$(ls packages/*.deb | head -1)
          echo "built: $DEB"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$DEB" \
            --title "Chess Assistant (rolling build)" \
            --notes "Rolling dev build. Use the v2.4 release for the stable download." \
            --prerelease
          gh release upload v2.4 "$DEB" --clobber || true
